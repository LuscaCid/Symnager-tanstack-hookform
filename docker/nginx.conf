worker_processes auto;
pid /run/nginx/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  server_tokens off;

  client_body_temp_path /var/cache/nginx/client_temp;
  proxy_temp_path /var/cache/nginx/proxy_temp;
  fastcgi_temp_path /var/cache/nginx/fastcgi_temp;
  uwsgi_temp_path /var/cache/nginx/uwsgi_temp;
  scgi_temp_path /var/cache/nginx/scgi_temp;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # camada extra de rate limit antes da API (a API também limita)
  limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
  limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
  limit_req_status 429;

  upstream symnager_api {
    server api:3333;
    keepalive 16;
  }

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # tamanho padrão pequeno; só a restauração de backup aceita arquivos grandes
    client_max_body_size 2m;

    include /etc/nginx/security-headers.conf;

    location = /healthz {
      access_log off;
      return 200 "ok";
    }

    location ~ ^/api/auth/(login|setup|refresh) {
      limit_req zone=auth burst=5 nodelay;
      proxy_pass http://symnager_api;
      include /etc/nginx/proxy_params_symnager;
    }

    location = /api/backup/restore {
      client_max_body_size 300m;
      proxy_request_buffering off;
      proxy_read_timeout 600s;
      proxy_pass http://symnager_api;
      include /etc/nginx/proxy_params_symnager;
    }

    location /api/ {
      limit_req zone=api burst=60 nodelay;
      proxy_pass http://symnager_api;
      proxy_read_timeout 300s;
      include /etc/nginx/proxy_params_symnager;
    }

    # assets com hash no nome: cache longo
    location /assets/ {
      expires 1y;
      add_header Cache-Control "public, immutable";
      include /etc/nginx/security-headers.conf;
      try_files $uri =404;
    }

    # SPA: qualquer rota volta para index.html
    location / {
      add_header Cache-Control "no-cache";
      include /etc/nginx/security-headers.conf;
      try_files $uri $uri/ /index.html;
    }
  }
}
